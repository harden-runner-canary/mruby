name: Container Outbound Call

on:
  workflow_dispatch:
    
permissions: read-all

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Harden Runner
        uses: prateek-stepsecurity/harden-runner@int
        with:
          egress-policy: block
          allowed-endpoints: 
            github.com:443
            registry-1.docker.io:443
      - uses: actions/checkout@v2.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - run: sudo iptables -L -v -n 

  build-arm:
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Harden Runner
        uses: prateek-stepsecurity/harden-runner@int
        with:
          egress-policy: block
          allowed-endpoints: 
            github.com:443
            registry-1.docker.io:443
      - uses: actions/checkout@v2.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - run: sudo iptables -L -v -n 
